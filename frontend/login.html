<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Health Portal</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-role="patient">

<div class="auth-shell">
  <aside class="auth-aside">
    <div class="brand">Health Portal</div>
    <div class="pitch">
      <h1>Good to see you again.</h1>
      <p>Log in with the same email and password you registered with. Doctors and admins use the credentials issued to them.</p>
    </div>
    <p class="muted" style="color:#9FB2AC; font-size:0.78rem;">Health Consultation &amp; Appointment Management Portal</p>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <div class="eyebrow">Sign in</div>
      <h1>Log in</h1>
      <div class="vital-divider"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
          <div class="error"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
          <div class="error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="muted" style="margin-top:20px; font-size:0.85rem;">
        New patient? <a href="register.html">Create an account</a>
      </p>
    </div>
  </main>
</div>

<script>window.API_BASE = '../backend/api';</script>
<script src="assets/js/api.js"></script>
<script src="assets/js/validation.js"></script>
<script>
const form = document.getElementById('loginForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const valid = validateForm(form, {
    email: [required, isEmail],
    password: [required],
  });
  if (!valid) return;

  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Logging in…';

  const res = await apiCall('auth', 'login', {
    email: form.email.value.trim(),
    password: form.password.value,
  });

  btn.disabled = false;
  btn.textContent = 'Log in';

  if (!res.success) {
    toast(res.message, 'error');
    return;
  }

  const role = res.data.role;
  if (role === 'patient') window.location.href = 'patient/dashboard.html';
  else if (role === 'doctor') window.location.href = 'doctor/dashboard.html';
  else window.location.href = 'admin/dashboard.html';
});
</script>

</body>
</html>
